name: Release files

# a ogni nuova release allega i file della card: Marketplace / HACS li scaricano da qui e GitHub li conta
# dalla 1.0.0-beta.8 è un file solo (isola-ha.js) più three.js per la casa 3D
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allega isola-ha.js e three.module.min.js alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.js --clobber
