<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isola · casa dimostrativa</title>
<style>html,body{margin:0;background:#0d1114}</style></head>
<body><isola-mobile id="c"></isola-mobile>
<script type="module">
// Casa dimostrativa "Famiglia Rossi": nessuna entità reale, solo per provare la configurazione automatica
const now = new Date(), iso = m => new Date(Date.now() - m * 60000).toISOString();
const S = {}, E = {};
const add = (id, state, attrs = {}, area = null, opt = {}) => { S[id] = { entity_id: id, state, attributes: attrs, last_changed: opt.lc || iso(30), last_updated: iso(1) }; E[id] = { entity_id: id, area_id: area, device_id: null, hidden: false, entity_category: opt.cat || null }; };
const areas = { soggiorno: 'Soggiorno', cucina: 'Cucina', camera: 'Camera', cameretta: 'Cameretta', bagno: 'Bagno', giardino: 'Giardino', lavanderia: 'Lavanderia' };
const A = Object.fromEntries(Object.entries(areas).map(([k, v]) => [k, { area_id: k, name: v }]));
add('sun.sun', 'above_horizon', { elevation: 32, azimuth: 205, next_setting: new Date(now.getTime() + 3 * 3600000).toISOString(), next_rising: new Date(now.getTime() + 15 * 3600000).toISOString(), friendly_name: 'Sole' });
add('weather.casa_rossi', 'partlycloudy', { temperature: 18, humidity: 62, wind_speed: 12, friendly_name: 'Casa' });
add('alarm_control_panel.allarme', 'disarmed', { friendly_name: 'Allarme' });
add('lock.porta_ingresso', 'locked', { friendly_name: 'Porta d’ingresso' }, 'soggiorno');
add('person.marco', 'home', { friendly_name: 'Marco', device_trackers: ['device_tracker.telefono_marco'] });
add('person.giulia', 'Lavoro', { friendly_name: 'Giulia', device_trackers: ['device_tracker.telefono_giulia'] });
add('sensor.telefono_marco_battery_level', '72', { unit_of_measurement: '%', device_class: 'battery' });
add('sensor.telefono_giulia_battery_level', '41', { unit_of_measurement: '%', device_class: 'battery' });
add('light.lampadario_soggiorno', 'on', { friendly_name: 'Lampadario', brightness: 180, supported_color_modes: ['color_temp', 'hs'], color_mode: 'color_temp', color_temp_kelvin: 2900, min_color_temp_kelvin: 2200, max_color_temp_kelvin: 6500, hs_color: [32, 55] }, 'soggiorno');
add('light.lampada_divano', 'off', { friendly_name: 'Lampada divano', supported_color_modes: ['onoff'] }, 'soggiorno');
add('media_player.tv_soggiorno', 'off', { friendly_name: 'TV soggiorno' }, 'soggiorno');
add('light.cucina_isola', 'off', { friendly_name: 'Luci isola', supported_color_modes: ['brightness'] }, 'cucina');
add('switch.macchina_caffe', 'off', { friendly_name: 'Macchina del caffè' }, 'cucina');
add('light.camera', 'off', { friendly_name: 'Luce camera', supported_color_modes: ['brightness'] }, 'camera');
add('climate.clima_camera', 'cool', { friendly_name: 'Clima camera', current_temperature: 24.5, temperature: 23, hvac_action: 'cooling', hvac_modes: ['off', 'cool', 'heat', 'dry', 'fan_only', 'auto'] }, 'camera');
add('light.cameretta', 'off', { friendly_name: 'Luce cameretta', supported_color_modes: ['onoff'] }, 'cameretta');
add('sensor.cameretta_temperatura', '21.4', { friendly_name: 'Temperatura cameretta', unit_of_measurement: '°C', device_class: 'temperature' }, 'cameretta');
add('light.bagno', 'off', { friendly_name: 'Luce bagno', supported_color_modes: ['onoff'] }, 'bagno');
add('binary_sensor.finestra_soggiorno', 'off', { friendly_name: 'Finestra soggiorno', device_class: 'window' }, 'soggiorno');
add('binary_sensor.finestra_cucina', 'on', { friendly_name: 'Finestra cucina', device_class: 'window' }, 'cucina');
add('binary_sensor.movimento_soggiorno', 'off', { friendly_name: 'Movimento soggiorno', device_class: 'motion' }, 'soggiorno', { lc: iso(4) });
add('switch.luci_giardino', 'on', { friendly_name: 'Luci giardino' }, 'giardino');
add('event.campanello', '2026-01-01T08:00:00.000Z', { friendly_name: 'Campanello', device_class: 'doorbell', event_types: ['ring'], event_type: 'ring' }, 'giardino');
add('camera.giardino', 'idle', { friendly_name: 'Giardino', entity_picture: './demo-cam.svg' }, 'giardino');
add('binary_sensor.giardino_motion', 'off', { friendly_name: 'Movimento giardino', device_class: 'motion' }, 'giardino', { lc: iso(12) });
add('vacuum.robi', 'cleaning', { friendly_name: 'Robi', battery_level: 64 }, 'soggiorno');
add('sensor.robi_battery_level', '64', { unit_of_measurement: '%', device_class: 'battery', friendly_name: 'Robi batteria' }, 'soggiorno', { cat: 'diagnostic' });
add('lawn_mower.erbetta', 'docked', { friendly_name: 'Erbetta' }, 'giardino');
add('sensor.erbetta_battery', '100', { unit_of_measurement: '%', friendly_name: 'Erbetta batteria' }, 'giardino');
add('sensor.lavatrice_machine_state', 'run', { friendly_name: 'Lavatrice' }, 'lavanderia');
add('sensor.lavatrice_completion_time', new Date(now.getTime() + 38 * 60000).toISOString(), { device_class: 'timestamp' }, 'lavanderia');
add('sensor.inverter_active_power', '2350', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Inverter potenza' });
add('sensor.inverter_daily_yield', '9.8', { unit_of_measurement: 'kWh', device_class: 'energy', friendly_name: 'Produzione oggi' });
add('sensor.batteria_casa_livello', '81', { unit_of_measurement: '%', device_class: 'battery', friendly_name: 'Batteria casa' });
add('sensor.batteria_casa_potenza', '620', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Batteria casa potenza' });
add('sensor.lavatrice_potenza', '480', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Lavatrice potenza' }, 'lavanderia');
add('sensor.frigorifero_potenza', '95', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Frigorifero' }, 'cucina');
add('sensor.clima_camera_potenza', '640', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Clima camera' }, 'camera');
add('sensor.illuminazione_potenza', '120', { unit_of_measurement: 'W', device_class: 'power', friendly_name: 'Luci' });
add('script.buonanotte', 'off', { friendly_name: 'Buonanotte' });
add('script.esco_di_casa', 'off', { friendly_name: 'Esco di casa' });
add('automation.luci_giardino_al_tramonto', 'on', { friendly_name: 'Luci giardino al tramonto', last_triggered: iso(300) });

// ---- demo in inglese: ?lang=en (nomi delle entità e delle stanze tradotti)
const EN = /[?&]lang=en\b/.test(location.search);
const NAMES_EN = {"Soggiorno": "Living room", "Cucina": "Kitchen", "Camera": "Bedroom", "Cameretta": "Kids room", "Bagno": "Bathroom", "Giardino": "Garden", "Lavanderia": "Laundry", "Lampadario": "Ceiling light", "Lampada divano": "Sofa lamp", "TV soggiorno": "Living room TV", "Luci isola": "Island lights", "Macchina del caffè": "Coffee machine", "Luce camera": "Bedroom light", "Clima camera": "Bedroom AC", "Luce cameretta": "Kids room light", "Temperatura cameretta": "Kids room temperature", "Luce bagno": "Bathroom light", "Finestra soggiorno": "Living room window", "Finestra cucina": "Kitchen window", "Movimento soggiorno": "Living room motion", "Luci giardino": "Garden lights", "Movimento giardino": "Garden motion", "Erbetta": "Mowy", "Erbetta batteria": "Mowy battery", "Robi batteria": "Robi battery", "Lavatrice": "Washer", "Allarme": "Alarm", "Porta d’ingresso": "Front door", "Casa": "Home", "Sole": "Sun", "Buonanotte": "Good night", "Esco di casa": "Leaving home", "Luci giardino al tramonto": "Garden lights at sunset", "Batteria casa": "Home battery", "Batteria casa potenza": "Home battery power", "Lavatrice potenza": "Washer power", "Frigorifero": "Fridge", "Luci": "Lights", "Inverter potenza": "Inverter power", "Produzione oggi": "Production today", "Lavoro": "Work", "Porta": "Door", "Casa Rossi": "The Rossi home", "Telefono marco": "Marco phone", "Telefono giulia": "Giulia phone"};
const tn = v => (EN && NAMES_EN[v]) || v;
if (EN) { for (const s of Object.values(S)) { if (s.attributes.friendly_name) s.attributes.friendly_name = tn(s.attributes.friendly_name); if (s.entity_id.startsWith('person.')) s.state = tn(s.state); } for (const a of Object.values(A)) a.name = tn(a.name); }
const hass = {
  states: S, entities: E, areas: A, devices: {}, language: EN ? 'en' : 'it', locale: { language: EN ? 'en' : 'it' },
  user: { name: 'Marco', is_admin: true },
  callWS: async m => {
    // dashboard simulata: il configuratore salva qui, solo in questa pagina
    if (m.type === 'lovelace/config') return JSON.parse(JSON.stringify(window.__dash));
    if (m.type === 'lovelace/config/save') { window.__dash = JSON.parse(JSON.stringify(m.config)); return null; }
    if (m.type === 'frontend/get_user_data') return { value: (window.__ud || {})[m.key] ?? null };
    if (m.type === 'frontend/set_user_data') { (window.__ud ||= {})[m.key] = m.value; return null; }
    if (m.type === 'history/history_during_period') { const out = {}; (m.entity_ids || []).forEach(id => { out[id] = [{ s: S[id]?.state || '0', lu: Date.now() / 1000 - 3600 }]; }); return out; }
    if (m.type === 'logbook/get_events') return [];
    if (m.type === 'energy/get_prefs') return window.__energyPrefs || { energy_sources: [] };
    if (m.type === 'recorder/statistics_during_period') return {};
    return {};
  },
  callService: (d, s, data) => { console.log('SERVICE', d, s, JSON.stringify(data)); return Promise.resolve(); },
  connection: { subscribeMessage: (cb, msg) => { setTimeout(() => cb({ forecast: [] }), 30); return Promise.resolve(() => {}); } },
  hassUrl: p => p,
};
await import('../src/isola-mobile.js');
await import('../src/isola-live.js');
const c = document.getElementById('c');
window.__cfg = { type: 'custom:isola-mobile', ...{
  image: './casa-demo.jpg',
  room_crops: { Soggiorno: [510, 120, 900, 510], Cucina: [910, 120, 1130, 510], Camera: [240, 120, 500, 330], Cameretta: [410, 340, 640, 510], Bagno: [240, 340, 400, 510], Giardino: [760, 520, 1340, 740] },
} };
window.__dash = { title: 'Demo', views: [{ title: 'Demo', type: 'panel', cards: [window.__cfg] }] };
if (EN) { const c0 = window.__cfg; if (c0.title) c0.title = tn(c0.title); (c0.sensors || []).forEach(m => { m.name = tn(m.name); }); if (c0.room_crops) c0.room_crops = Object.fromEntries(Object.entries(c0.room_crops).map(([k, v]) => [tn(k), v])); if (c0.casa_live && c0.casa_live.title) c0.casa_live.title = tn(c0.casa_live.title); window.__dash.views[0].cards[0] = c0; }
c.setConfig(window.__cfg);
c.hass = hass;
window.__hass = hass;
</script></body></html>
